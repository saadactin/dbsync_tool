services:
  superset_db:
    image: postgres:15
    container_name: superset_db
    environment:
      POSTGRES_DB: ${SUPERSET_DB_NAME}
      POSTGRES_USER: ${SUPERSET_DB_USER}
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - superset_network

  superset_cache:
    image: redis:7
    container_name: superset_cache
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - superset_network

  superset:
    image: apache/superset:latest-dev
    container_name: superset
    environment:
      - SUPERSET_SECRET_KEY=${SUPERSET_SECRET_KEY}
      - DATABASE_HOST=${SUPERSET_DB_HOST}
      - DATABASE_PORT=${SUPERSET_DB_PORT}
      - DATABASE_DB=${SUPERSET_DB_NAME}
      - DATABASE_USER=${SUPERSET_DB_USER}
      - DATABASE_PASSWORD=${SUPERSET_DB_PASSWORD}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - "8088:8088"
    depends_on:
      superset_db:
        condition: service_healthy
      superset_cache:
        condition: service_healthy
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint:
      - /bin/sh
      - -c
      - |
        pip install psycopg2-binary
        superset db upgrade
        superset fab create-admin --username $${ADMIN_USERNAME:-admin} --firstname $${ADMIN_FIRSTNAME:-Admin} --lastname $${ADMIN_LASTNAME:-User} --email $${ADMIN_EMAIL:-admin@example.com} --password $${ADMIN_PASSWORD:-admin} || true
        superset init
        superset run -h 0.0.0.0 -p 8088 --with-threads --reload --debugger
    networks:
      - superset_network

volumes:
  superset_db_data:
  superset_home:

networks:
  superset_network:
    driver: bridge
