{% extends 'base.html' %}
{% load static %}

{% block title %}Job Not Found - DB Sync Tool{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center py-5">
                    <h2 class="text-danger mb-3">Job Not Found</h2>
                    <p class="text-muted">The sync job you are looking for does not exist or you don't have permission to access it.</p>
                    <a href="{% url 'sync_jobs:list' %}" class="btn btn-primary">Back to Job List</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
