{% extends 'base.html' %}
{% load static %}

{% block title %}Permission Denied - DB Sync Tool{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center py-5">
                    <h2 class="text-warning mb-3">Permission Denied</h2>

                    <a href="{% url 'sync_jobs:list' %}" class="btn btn-primary">Back to Job List</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
