{% extends "base.html" %}

{% block title %}Server Error{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h4 class="mb-0">Server Error</h4>
                </div>
                <div class="card-body">
                    <p class="lead">An error occurred while processing your request.</p>
                    <p>Please try again later or contact the administrator if the problem persists.</p>
                    
                    <div class="mt-4">
                        <a href="{% url 'sync_jobs:dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
                        <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
